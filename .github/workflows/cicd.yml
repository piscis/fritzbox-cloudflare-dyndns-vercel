name: Build & Deploy

concurrency:
  group: 'workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: false
  DO_NOT_TRACK: 1

on:
  push:
    branches: [main, released]
  # No branch filter: a stacked PR targets its predecessor rather than main, and
  # would otherwise get no checks at all until it is retargeted.
  pull_request:
jobs:
  setup-stage:
    timeout-minutes: 1
    outputs:
      env-name: ${{ steps.env-name.outputs.env }}
      # Phase environment names are capitalised; the GitHub Environment names are
      # not. Emit both so the deploy job never has to transform one into the other.
      phase-env: ${{ steps.env-name.outputs.phase_env }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment name
        id: env-name
        run: |
          if [[ ${GITHUB_HEAD_REF} == dev/* || ${GITHUB_HEAD_REF} == renovate/* ]]; then
            echo "env=development" >> $GITHUB_OUTPUT
            echo "phase_env=Development" >> $GITHUB_OUTPUT
          elif [[ "${{github.ref}}" == "refs/heads/main" && "${{github.event_name}}" == "push" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "phase_env=Staging" >> $GITHUB_OUTPUT
          elif [[ "${{github.ref}}" == "refs/heads/released" && "${{github.event_name}}" == "push" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "phase_env=Production" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "phase_env=Development" >> $GITHUB_OUTPUT
          fi

  lint:
    timeout-minutes: 5
    name: Lint ✅
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Lint App
        shell: bash
        run: |
          pnpm run lint

  typecheck:
    timeout-minutes: 10
    name: Typecheck 🔎
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Typecheck App
        shell: bash
        run: |
          pnpm run typecheck

  test:
    timeout-minutes: 12
    name: Test 🧪
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Test App
        shell: bash
        run: |
          pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build-deploy:
    timeout-minutes: 10
    name: Build 🏗️ & Deploy 🚀 (${{ needs.setup-stage.outputs.env-name }})
    environment: ${{ needs.setup-stage.outputs.env-name }}
    needs: [setup-stage, lint, typecheck, test]
    # push to main -> staging, push to released -> production. Each stage has its
    # own CF_WORKER_NAME and CF_ROUTE_PATTERN in Phase, so they deploy separate
    # Workers and staging cannot overwrite production.
    if: contains(fromJson('["staging", "production"]'), needs.setup-stage.outputs.env-name)
    runs-on: ubuntu-latest

    # Job-level so both phase invocations below are covered. Job containers do
    # not inherit runner host env, so this mapping is required, not decorative.
    #
    # Both resolve from the GitHub Environment named above, so `staging` and
    # `production` each supply their own scoped token. PHASE_HOST accepts either a
    # variable or a secret -- an empty value would silently fall back to Phase's
    # cloud host instead of the self-hosted one, which fails as an auth error far
    # from its cause.
    env:
      PHASE_SERVICE_TOKEN: ${{ secrets.PHASE_SERVICE_TOKEN }}
      PHASE_HOST: ${{ vars.PHASE_HOST || secrets.PHASE_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Install Phase CLI
        run: curl -fsSL https://pkg.phase.dev/install.sh | bash -s -- --version 2.3.1

      - name: Verify Phase credentials
        # Fail here with a clear message rather than deep inside a build, where a
        # missing token surfaces as an unrelated-looking auth or resolution error.
        run: |
          test -n "$PHASE_SERVICE_TOKEN" \
            || { echo "::error::PHASE_SERVICE_TOKEN is not set on the '${{ needs.setup-stage.outputs.env-name }}' environment"; exit 1; }
          test -n "$PHASE_HOST" \
            || { echo "::error::PHASE_HOST is not set on the '${{ needs.setup-stage.outputs.env-name }}' environment"; exit 1; }
          echo "Phase host: $PHASE_HOST"

      - name: Build & Deploy
        run: |
          # --env overrides the Development default in .phase.json.
          # `pnpm exec` is required because phase run spawns via `sh -c`, which
          # does not have node_modules/.bin on PATH. The deploy command is quoted
          # so phase does not parse --cwd as one of its own flags.
          phase run --env "$PHASE_ENV" pnpm exec nuxt build
          phase run --env "$PHASE_ENV" "pnpm exec wrangler --cwd .output deploy"
        env:
          NITRO_PRESET: cloudflare_module
          PHASE_ENV: ${{ needs.setup-stage.outputs.phase-env }}
