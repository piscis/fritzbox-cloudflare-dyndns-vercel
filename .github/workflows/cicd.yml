name: Build & Deploy

concurrency:
  group: 'workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: false
  DO_NOT_TRACK: 1

on:
  push:
    branches: [main, released]
  pull_request:
jobs:
  setup-stage:
    timeout-minutes: 1
    outputs:
      env-name: ${{ steps.env-name.outputs.env }}
      phase-env: ${{ steps.env-name.outputs.phase_env }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup environment name
        id: env-name
        run: |
          if [[ ${GITHUB_HEAD_REF} == dev/* || ${GITHUB_HEAD_REF} == renovate/* ]]; then
            echo "env=development" >> $GITHUB_OUTPUT
            echo "phase_env=Development" >> $GITHUB_OUTPUT
          elif [[ "${{github.ref}}" == "refs/heads/main" && "${{github.event_name}}" == "push" ]]; then
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "phase_env=Staging" >> $GITHUB_OUTPUT
          elif [[ "${{github.ref}}" == "refs/heads/released" && "${{github.event_name}}" == "push" ]]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "phase_env=Production" >> $GITHUB_OUTPUT
          else
            echo "env=development" >> $GITHUB_OUTPUT
            echo "phase_env=Development" >> $GITHUB_OUTPUT
          fi

  lint:
    timeout-minutes: 5
    name: Lint ✅
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Lint App
        shell: bash
        run: |
          pnpm run lint

  typecheck:
    timeout-minutes: 10
    name: Typecheck 🔎
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Typecheck App
        shell: bash
        run: |
          pnpm run typecheck

  test:
    timeout-minutes: 12
    name: Test 🧪
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Test App
        shell: bash
        run: |
          pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  browser:
    timeout-minutes: 12
    name: Browser 🌐
    needs: [setup-stage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Read playwright-core version
        id: playwright
        shell: bash
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Chromium
        id: chromium-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-playwright-core-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pnpm exec playwright-core install --with-deps --only-shell chromium

      - name: Install Chromium system dependencies
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          pnpm exec playwright-core install-deps chromium-headless-shell

      - name: Browser Test App
        shell: bash
        run: |
          pnpm run test:browser

  build-deploy:
    timeout-minutes: 10
    name: Build 🏗️ & Deploy 🚀 (${{ needs.setup-stage.outputs.env-name }})
    environment: ${{ needs.setup-stage.outputs.env-name }}
    needs: [setup-stage, lint, typecheck, test, browser]
    if: contains(fromJson('["staging", "production"]'), needs.setup-stage.outputs.env-name)
    runs-on: ubuntu-latest

    env:
      PHASE_SERVICE_TOKEN: ${{ secrets.PHASE_SERVICE_TOKEN }}
      PHASE_HOST: ${{ vars.PHASE_HOST || secrets.PHASE_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Environment
        run: |
          echo "Environment: ${{ needs.setup-stage.outputs.env-name }}"

      - name: Setup
        uses: ./.github/actions/setup-node

      - name: Install Phase CLI
        run: curl -fsSL https://pkg.phase.dev/install.sh | bash -s -- --version 2.3.1

      - name: Verify Phase credentials
        run: |
          test -n "$PHASE_SERVICE_TOKEN" \
            || { echo "::error::PHASE_SERVICE_TOKEN is not set on the '${{ needs.setup-stage.outputs.env-name }}' environment"; exit 1; }
          test -n "$PHASE_HOST" \
            || { echo "::error::PHASE_HOST is not set on the '${{ needs.setup-stage.outputs.env-name }}' environment"; exit 1; }
          echo "Phase credentials present."

      - name: Build & Deploy
        run: |
          phase run --env "$PHASE_ENV" pnpm exec nuxt build
          phase run --env "$PHASE_ENV" "pnpm exec wrangler --cwd .output deploy"
        env:
          NITRO_PRESET: cloudflare_module
          PHASE_ENV: ${{ needs.setup-stage.outputs.phase-env }}
