name: Delete old workflow runs
on:
  workflow_dispatch:
    inputs:
      days:
        description: Retain days back
        required: true
        default: '30'
        type: string
  schedule:
    - cron: '5 4 * * 1'

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: ${{ github.event.inputs.days || 30 }}
          keep_minimum_runs: 6
