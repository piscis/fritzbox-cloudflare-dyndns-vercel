allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Pulled in by reka-ui -> @floating-ui/vue (a @nuxt/ui dependency). Its
  # postinstall runs vue-demi-switch, which points the package at the Vue 3
  # entry points; without it the Vue 2 shim is left in place.
  vue-demi: true
  workerd: true

# pnpm 11 defaults minimumReleaseAge to 1440 (1 day); these were newer than that
# when the lockfile was written.
minimumReleaseAgeExclude:
  - release-it@21.0.1
  - wrangler@4.118.0

# Required by @antfu/eslint-config, which pins this through
# `pnpm/yaml-enforce-settings`. Removing it fails `pnpm lint`.
shellEmulator: true
trustPolicy: no-downgrade

# semver@6.3.1 is Babel's own pinned transitive dep (@babel/core, @babel/generator).
# no-downgrade flags it only because semver 7.x carries newer provenance attestation.
trustPolicyExclude:
  - semver@6.3.1

packages:
  - .

# `pnpm update` does not refresh auto-installed peer dependencies, even at
# `--depth Infinity`, so these sat on versions with open advisories.
#
# webpack was only ever an *optional* peer (of unplugin and terser-webpack-plugin);
# Nuxt 4 builds with Vite/Rolldown and never used it. Pinning it stops pnpm
# auto-installing the stale peer, which drops the whole unused subtree --
# terser-webpack-plugin -> schema-utils -> ajv@8 -> fast-uri -- and the 7 advisories
# that came with it. The ajv and fast-uri pins are belt-and-braces should a future
# dependency pull that subtree back in. `ajv@8` is scoped to the 8.x line so eslint's
# ajv@6, a different and incompatible API, is left alone.
#
# esbuild covers GHSA-g7r4-m6w7-qqqr (path traversal in the esbuild dev server on
# Windows, fixed in 0.28.1). The whole tree already resolved to 0.28.1 except
# @nuxt/fonts -> fontless, which declares `^0.27.0` and so can never reach the fix
# on its own; fontless 0.2.1 is the latest release, so there is nothing to upgrade
# to. fontless imports only `transform` for CSS minification and never starts a dev
# server, so it was not actually exposed -- the override just dedupes the tree onto
# the patched version. Drop it once fontless widens its own range.
overrides:
  ajv@8: ^8.20.0
  esbuild: ^0.28.2
  fast-uri: ^4.1.4
  webpack: ^5.110.3
