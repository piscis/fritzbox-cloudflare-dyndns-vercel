# pnpm 11 reads only auth/registry settings from .npmrc, so every other setting
# lives here. Key order is enforced by @antfu/eslint-config (yaml/sort-keys).

# Replaces the pnpm 10 `onlyBuiltDependencies` list.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Pulled in by reka-ui -> @floating-ui/vue (a @nuxt/ui dependency). Its
  # postinstall runs vue-demi-switch, which points the package at the Vue 3
  # entry points; without it the Vue 2 shim is left in place.
  vue-demi: true
  workerd: true

# pnpm 11 defaults minimumReleaseAge to 1440 (1 day); these were newer than that
# when the lockfile was written.
minimumReleaseAgeExclude:
  - release-it@21.0.1
  - wrangler@4.118.0

# Required by @antfu/eslint-config, which pins this through
# `pnpm/yaml-enforce-settings`. Removing it fails `pnpm lint`.
shellEmulator: true
trustPolicy: no-downgrade

# semver@6.3.1 is Babel's own pinned transitive dep (@babel/core, @babel/generator).
# no-downgrade flags it only because semver 7.x carries newer provenance attestation.
trustPolicyExclude:
  - semver@6.3.1

packages:
  - .
# ajv and webpack are auto-installed peers (ajv via ajv-formats/ajv-keywords,
# webpack via unplugin/terser-webpack-plugin) and fast-uri rides along as ajv's own
# dependency. `pnpm update` does not refresh peer-resolved versions even at
# `--depth Infinity`, so they sat on versions with open advisories. All three are
# build-time only and never reach `.output/server`. The `ajv@8` selector scopes the
# override to the 8.x line so eslint's ajv@6 -- a different, incompatible API -- is
# left alone.
overrides:
  ajv@8: ^8.20.0
  fast-uri: ^3.1.5
  webpack: ^5.109.2
